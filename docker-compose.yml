# The database is a managed MySQL 8 (Aiven), not a container. The API reads its URL
# and credentials from backend/.env (gitignored; see backend/.env.example).
services:
  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      # The CA file is mounted below; this path is where it lives in the container.
      APP_DB_SSL_CA: /srv/ca.pem
    volumes:
      - ./backend/ca.pem:/srv/ca.pem:ro
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
